name: CI

on:
  pull_request:
  push:
    branches: [main, 'statwindow/editorial-season-two-20261116']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content check (fails on bad data, warns when fewer than 7 days remain)
        run: npm run content:check
      - name: Bonus-fact coverage and spoiler audit (partial editorial milestone)
        run: npm run content:trivia:check
      - name: NBA database (reproducible SQLite build, reports, day files and Survival catalog up to date)
        run: npm run nba:db -- --out build/nba.sqlite && npm run nba:report:check && npm run content:publish:check && npm run survival:catalog:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Analytics wiring (VITE_ANALYTICS=vercel build, Vercel script stubbed, nothing sent)
        run: npm run test:e2e:analytics
      - name: Survival behind its flag (VITE_SURVIVAL=preview and =on builds; production stays off)
        run: npm run test:e2e:survival
