name: CI

on:
  pull_request:
  push:
    branches: [main]

# Retain rigorous checks, but avoid burning free runner time on obsolete intermediate
# source commits while the editorial generator is publishing the new day's files.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A real Redis for server/redis.test.ts (the score API's Lua scripts). Free, runs inside the job.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content check (fails on bad data, warns when fewer than 7 days remain)
        run: npm run content:check
      - name: Original 52-day trivia completeness, provenance and spoiler gate
        run: npm run content:trivia:check -- --require-original
      - name: NBA database (reproducible SQLite build, reports, day files and Survival catalog up to date)
        run: npm run nba:db -- --out build/nba.sqlite && npm run nba:report:check && npm run content:publish:check && npm run survival:catalog:check
      - name: Published days unchanged relative to main (the lock only grows)
        run: git fetch --no-tags --depth=1 origin main && npm run content:lock:base -- --base FETCH_HEAD
      - name: Brand SVGs generated from the canonical symbol
        run: npm run brand:check
      - name: Review-gated cross-sport Question Factory
        run: npm run factory:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test --project=desktop --project=mobile
      - name: Analytics wiring (VITE_ANALYTICS=vercel build, Vercel script stubbed, nothing sent)
        run: npm run test:e2e:analytics
      - name: Survival behind its flag (VITE_SURVIVAL=preview and =on builds; production stays off)
        run: npm run test:e2e:survival

  # Safari coverage (iPhone 13 on WebKit) in its own job, so it runs in parallel and the main job keeps its 15-minute budget.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: End-to-end tests on WebKit (iPhone 13)
        run: npx playwright test --project=webkit-mobile

  # The future opt-in leaderboard is intentionally disabled in the shipping build.
  # Keep its simulation tests green in a separate build that never deploys.
  # Formal V3 launch is separate from the public beta and must be proved with
  # a preview-only build, including the retirement of old share links and archives.
  # This never sets Production LAUNCH_DAY or deletes any scores.
  launch-day-reset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install desktop/mobile Chromium and iPhone WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify beta unchanged until launch, fresh Day 1, archive, retired links and preserved saves
        run: LAUNCH_E2E=1 npx playwright test e2e/launch.spec.ts --project=desktop --project=mobile --project=webkit-mobile

  leaderboard-scaffold:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install desktop Chromium and iPhone WebKit engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test dormant opt-in enrollment, rate/error retries, erasure and UI on isolated QA build
        run: LEADERBOARD_E2E=1 npx playwright test e2e/leaderboard.spec.ts --project=desktop --project=webkit-mobile
