name: Regenerate NBA editorial artifacts (milestone branch only)

on:
  push:
    branches:
      - statwindow/editorial-season-two-20261116
    paths:
      - data/nba/facts.json
      - data/nba/calendar.json

permissions:
  contents: write

concurrency:
  group: stat-window-editorial-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate future slates, lock, proof reports and safe Survival catalog
        run: |
          npm run content:publish
          npm run nba:report
          npm run survival:catalog
          npm run content:check
      - name: Commit deterministic generated files back to this isolated branch
        shell: bash
        run: |
          git add content/days content/published.lock.json content/survival/catalog.json docs/nba
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(editorial): sync verified source to generated NBA artifacts [skip editorial sync]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
