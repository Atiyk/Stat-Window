name: Temporary leaderboard worker Redis QA
on:
  push:
    branches: [statwindow/v3-leaderboard-final-worker]
permissions:
  contents: read
jobs:
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run server/leaderboard-redis.test.ts server/leaderboard.test.ts
