name: V3 editorial final sixteenth QA with confirmed Survival beta threshold
on:
  push:
    branches:
      - statwindow/v3-editorial-final-worker
    paths:
      - .github/workflows/v3-editorial-canonical-sync.yml
permissions:
  contents: write
jobs:
  publisher:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical NBA publisher, database, reports and Survival generation
        run: |
          npm run content:publish
          npm run nba:db
          npm run nba:report
          npm run survival:catalog
      - name: Protect existing published scores and question files
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const original=JSON.parse(execFileSync('git',['show','HEAD:content/published.lock.json'],{encoding:'utf8'}));
          const generated=JSON.parse(readFileSync('content/published.lock.json','utf8'));
          const cutoff=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          for(const [date,lock] of Object.entries(original)) if(date<=cutoff&&JSON.stringify(generated[date])!==JSON.stringify(lock))throw Error('Published fingerprint changed: '+date);
          const files=execFileSync('git',['diff','--name-only','--','content/days'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const file of files){const date=/content\/days\/(\d{4}-\d{2}-\d{2})\.json$/.exec(file)?.[1];if(date&&date<=cutoff)throw Error('Published question changed: '+file);}
          console.log('Published puzzles and locks unchanged through '+cutoff+'; future day files modified '+files.length);
          NODE
      - name: Run full publisher source rights trivia factory types tests and build
        run: |
          npm run content:publish:check
          npm run nba:report:check
          npm run survival:catalog:check
          npm run content:check
          npm run content:trivia:check -- --require-original
          npm run factory:check
          node --experimental-strip-types scripts/nba/editorial-audit.ts --report-only
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated future-only artifacts and delete temporary workflow
        run: |
          git add -- content/days content/published.lock.json content/survival/catalog.json docs/nba
          git rm -- .github/workflows/v3-editorial-canonical-sync.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate and validate last five January NBA finales'
          git push origin HEAD:refs/heads/statwindow/v3-editorial-final-worker
