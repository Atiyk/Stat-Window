name: V3 editorial canonical publish with Survival reserve embargo
on:
  push:
    branches:
      - statwindow/v3-editorial-final-worker
    paths:
      - .github/workflows/v3-editorial-canonical-sync.yml

permissions:
  contents: write

jobs:
  publish-checked-future:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonical future-only NBA publisher, reports and spoiler-safe Survival
        run: |
          npm run content:publish
          npm run nba:report
          npm run survival:catalog
      - name: Verify no published day was modified
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=America/New_York date +%F)"
          while IFS= read -r path; do
            if [[ "$path" =~ ^content/days/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]]; then
              if [[ "${BASH_REMATCH[1]}" < "$today" || "${BASH_REMATCH[1]}" == "$today" ]]; then
                echo "ERROR: attempting change to published day $path"
                exit 1
              fi
            fi
          done < <(git diff --name-only)
          git diff --check
      - name: Canonical editorial publication checks
        run: |
          npm run nba:db -- --out build/nba.sqlite
          npm run content:publish:check
          npm run nba:report:check
          npm run survival:catalog:check
          npm run content:check
          npm run content:trivia:check -- --require-original
          npm run factory:check
          node --experimental-strip-types scripts/nba/editorial-audit.ts --report-only
          npm run typecheck
          npm test
          npm run build
      - name: Commit only validated generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -- content/days content/published.lock.json content/survival/catalog.json docs/nba/questions.csv docs/nba/calendar.md docs/nba/validation.md
          if git diff --cached --quiet; then
            echo "No generated artifacts changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonical publish and validate two new future NBA openings"
          git push origin HEAD:refs/heads/statwindow/v3-editorial-final-worker
