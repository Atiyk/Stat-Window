name: V3 editorial one-time generator

on:
  push:
    branches:
      - statwindow/v3-launchweek-candidate-20261122
    paths:
      - .github/workflows/v3-editorial-publish-once.yml
      - data/nba/facts.json
      - data/nba/calendar.json

concurrency:
  group: v3-editorial-launchweek-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout worker candidate (never production or integration)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical future slates, published scoring locks, Survival and editorial reports
        run: |
          npm run content:publish
          npm run survival:catalog
          npm run nba:report
      - name: Validate every generated artifact and NBA source
        run: |
          npm run content:check
          npm run content:publish:check
          npm run survival:catalog:check
          npm run nba:report:check
          npm run content:trivia:check -- --require-original
          npm run factory:check
          npm run typecheck
          npm test
          npm run build
      - name: Inspect generated paths; prepare one-time cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected=$(git diff --name-only | grep -Ev '^(content/days/2026-(11-28|12-01|12-03|12-04)\.json|content/published\.lock\.json|content/survival/catalog\.json|docs/nba/(questions\.csv|calendar\.md|validation\.md))$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generator output (refusing publication):\n%s\n' "$unexpected"
            exit 1
          fi
          git add content/days/2026-11-28.json content/days/2026-12-01.json content/days/2026-12-03.json content/days/2026-12-04.json
          git add content/published.lock.json content/survival/catalog.json
          git add docs/nba/questions.csv docs/nba/calendar.md docs/nba/validation.md
          git rm .github/workflows/v3-editorial-publish-once.yml
          git diff --cached --check
          git diff --cached --stat
      - name: Commit generated files to worker branch only (fast forward, no force)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'statwindow/v3-launchweek-candidate-20261122' ] || exit 1
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
          remote_sha=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'Worker branch moved while generating: no push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate verified launch-week slates, score lock, Survival and reports'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
