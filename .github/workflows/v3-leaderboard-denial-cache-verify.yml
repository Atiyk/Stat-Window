name: V3 leaderboard denied-request proof (temporary worker QA)
on:
  push:
    branches: [statwindow/v3-leaderboard-final-worker]
permissions:
  contents: read
concurrency:
  group: v3-lb-denial-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deny-cache-and-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact-SHA TypeScript
        run: npm run typecheck
      - name: Leaderboard unit and disposable Redis 7 integration regressions
        run: npx vitest run server/leaderboard.test.ts server/leaderboard-redis.test.ts
      - name: API bundle parity and app build
        run: npm run build
