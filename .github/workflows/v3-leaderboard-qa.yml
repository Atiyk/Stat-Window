name: V3 one-time leaderboard real-Redis independent QA
# Retest with TypeScript-safe GPC/DNT header fixtures.
on:
  push:
    branches:
      - statwindow/v3-leaderboard-qa-20261122
    paths:
      - .github/workflows/v3-leaderboard-qa.yml
permissions:
  contents: write
jobs:
  prove:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict TypeScript, full security/backend tests against disposable real Redis
        run: npm run typecheck && npm test
      - name: Production API bundle parity and free-tier fail-closed contract
        run: npm run api:build && npm run api:check
      - name: Editorial-free smoke build and no-leaderboard-change content gates
        run: npm run content:check && npm run factory:check && npm run build
      - name: Remove this one-shot workflow on its successful QA branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-leaderboard-qa.yml
          git commit -m "Remove completed one-time leaderboard QA workflow"
          git push origin HEAD:refs/heads/statwindow/v3-leaderboard-qa-20261122
