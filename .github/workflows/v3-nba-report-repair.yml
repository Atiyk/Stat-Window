name: V3 one-time NBA report regeneration

# Temporary branch-scoped repair. It only runs when this workflow itself is
# added/edited on the integration branch, not for subsequent report commits.
on:
  push:
    branches:
      - statwindow/v3-coordinated-20261122
    paths:
      - .github/workflows/v3-nba-report-repair.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate reports from canonical NBA data
        run: npm run nba:report
      - name: Regenerate Survival catalog with its spoiler and spent-reserve protections
        run: npm run survival:catalog
      - name: Validate reports, publication lock and Survival
        run: npm run nba:report:check && npm run content:publish:check && npm run survival:catalog:check
      - name: Commit only canonical generated reports
        run: |
          git diff --check
          git add -- docs/nba/questions.csv docs/nba/calendar.md docs/nba/validation.md content/survival/catalog.json
          if git diff --cached --quiet; then
            echo "Reports were already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate NBA editorial reports from canonical V3 data"
          git push origin HEAD:refs/heads/statwindow/v3-coordinated-20261122
