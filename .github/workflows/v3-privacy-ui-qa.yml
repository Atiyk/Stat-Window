name: V3 one-time leaderboard privacy browser QA
on:
  push:
    branches:
      - statwindow/v3-privacy-ui-qa-20261122
    paths:
      - .github/workflows/v3-privacy-ui-qa.yml
permissions:
  contents: write
jobs:
  test:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      - name: Verify GPC DNT fail-closed leaderboard UI on desktop mobile and WebKit
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test e2e/leaderboard.spec.ts --project=desktop --project=mobile --project=webkit-mobile
      - name: Remove one-time workflow after successful independent QA
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-privacy-ui-qa.yml
          git commit -m "Remove completed one-time privacy UI QA workflow"
          git push origin HEAD:refs/heads/statwindow/v3-privacy-ui-qa-20261122
