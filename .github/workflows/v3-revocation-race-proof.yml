name: V3 one-time atomic revocation real Redis QA
on:
  push:
    branches: [statwindow/v3-revocation-race-qa-20261122]
    paths: [.github/workflows/v3-revocation-race-proof.yml]
permissions: {contents: write}
jobs:
  check:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full TypeScript and all unit tests including Redis 7 races
        run: npm run typecheck && npm test
      - name: Full production bundle and API build parity
        run: npm run build
      - name: Remove temporary workflow after success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-revocation-race-proof.yml
          git commit -m "Remove completed one-time atomic revocation proof"
          git push origin HEAD:refs/heads/statwindow/v3-revocation-race-qa-20261122
