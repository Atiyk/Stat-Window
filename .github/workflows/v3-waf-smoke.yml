name: V3 one-time real-edge WAF smoke (no production writes)
on:
  push:
    branches: [statwindow/v3-waf-qa-20261122]
    paths: [.github/workflows/v3-waf-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    if: github.repository == 'Atiyk/Stat-Window'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed IP-based rate limit for disabled leaderboard GET only
        shell: bash
        run: |
          set -euo pipefail
          # Read-only GETs on the already-public site; no cookies, player code,
          # score submission or synthetic Upstash writes.
          statuses=""
          for n in $(seq 1 16); do
            status=$(curl -sS --retry 0 --connect-timeout 5 --max-time 12 -o /dev/null -w '%{http_code}' \
              'https://stat-window.vercel.app/api/leaderboard?period=day')
            statuses="$statuses $status"
          done
          echo "WAF real-edge GET status codes:$statuses"
          if [[ " $statuses " != *" 429 "* ]]; then
            echo "::error::No 429 from the 12/minute project WAF rule; do not enable leaderboard until explained."
            exit 1
          fi
          echo "Vercel's public edge returned 429 for the protected route."
      - name: Remove one-shot workflow after success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-waf-smoke.yml
          git commit -m "Remove successful one-time WAF smoke workflow"
          git push origin HEAD:refs/heads/statwindow/v3-waf-qa-20261122
